services:
  builder:
    build: .
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/work/target
    working_dir: /work
    command: >
      bash -c "set -e;
      cargo build --release;
      mkdir -p dist;
      cp target/release/steam-tunnel dist/;
      cp \"$$(find target/release/build -name libsteam_api.so -printf '%T@ %p\\n' | sort -rn | head -1 | cut -d' ' -f2-)\" dist/;
      echo 480 > dist/steam_appid.txt;
      echo 'BUILD OK -> dist/'"

volumes:
  cargo-registry:
  target-cache:
